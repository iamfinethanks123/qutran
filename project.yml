name: OpenClip
options:
  bundleIdPrefix: com.openclip
  developmentLanguage: en
  knownRegions: [en, Base, zh-Hans, zh-Hant, fr, ja]
targets:
  Core:
    type: framework
    platform: macOS
    deploymentTarget: "26.0"
    sources: [Sources/Core]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
  OpenClip:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/OpenClip
      - path: PersonalExtensions
        type: folder
        buildPhase: resources
      - path: LICENSE
        type: file
        buildPhase: resources
      - path: NOTICE.md
        type: file
        buildPhase: resources
    info:
      path: Sources/OpenClip/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.openclip.url
            CFBundleURLSchemes:
              - openclip
              - openclip-dev
        CFBundleDocumentTypes:
          - CFBundleTypeName: Qutran Extension
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.openclip.extension
            LSTypeIsPackage: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.openclip.extension
            UTTypeDescription: Qutran Extension
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - openclipext
        LSUIElement: true
        NSHumanReadableCopyright: "Qutran — based on OpenClip, © 2026 Ganesh M and OpenClip Contributors. AGPL-3.0 licensed."
        NSAppleEventsUsageDescription: "Qutran needs to control other apps to run your AppleScript actions and to paste results back into the app you were using."
        SUFeedURL: https://github.com/ganeshmshetty/openclip/releases/latest/download/appcast.xml
        SUPublicEDKey: JbyKx5LUkYkM+ovsJ1NPDR2W+1ptfdsu6b51KBsKhWo=
        SUScheduledCheckInterval: 86400
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        CFBundleLocalizations:
          - en
          - zh-Hans
          - zh-Hant
          - fr
          - ja
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/OpenClip/OpenClip.entitlements
        PRODUCT_MODULE_NAME: OpenClip
        PRODUCT_NAME: Qutran
        # Ad-hoc is the default so a clone builds and runs with no Apple Developer account.
        # scripts/sign_artifact.sh overrides the identity for signed/notarized builds.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.qutran.Qutran
          INFOPLIST_KEY_CFBundleDisplayName: Qutran
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.qutran.Qutran
          INFOPLIST_KEY_CFBundleDisplayName: Qutran
    dependencies:
      - target: Core
      - package: OpenSelection
      - package: KeyboardShortcuts
      - package: SDWebImageSwiftUI
      - package: SDWebImageSVGCoder
      - package: Sparkle
  OpenClipTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources: [Tests/OpenClipTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # The app's product name is Qutran, so point the test host at it explicitly.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Qutran.app/Contents/MacOS/Qutran"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: OpenClip
      - package: OpenSelection
packages:
  OpenSelection:
    url: https://github.com/ganeshmshetty/OpenSelection.git
    exactVersion: 2.16.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  SDWebImageSwiftUI:
    url: https://github.com/SDWebImage/SDWebImageSwiftUI
    from: 3.0.0
  SDWebImageSVGCoder:
    url: https://github.com/SDWebImage/SDWebImageSVGCoder
    from: 1.7.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
